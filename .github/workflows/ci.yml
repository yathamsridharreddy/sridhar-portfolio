name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Install, check and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint if one is configured
        run: |
          if npm run --silent lint --if-present >/dev/null 2>&1; then
            npm run lint --if-present
          else
            echo "No lint script configured, skipping."
          fi

      - name: Run tests if any are configured
        run: npm run test --if-present

      - name: Build for production
        run: npm run build

      - name: Confirm the build produced output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          echo "Build output:"
          du -sh dist
          ls -1 dist/assets | head -20
